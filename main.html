<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plink</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Plink" />
    <meta name="theme-color" content="#d46b7a" />
    <link rel="apple-touch-icon" href="/static/icon.png" />
    <link rel="icon" type="image/png" href="/static/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@300..600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/cropperjs@1.6.1/dist/cropper.min.css"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: oklch(0.97 0.012 60);
        font-family: "Geist", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        min-height: 100vh;
      }
      *::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      button {
        font-family: inherit;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 1.5px solid currentColor;
        outline-offset: 2px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/cropperjs@1.6.1/dist/cropper.min.js"></script>
    <script type="text/babel">
      {% raw %}
      const { useState, useRef, useEffect } = React;

      const _iosHapticLabel = (() => {
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.setAttribute('switch', '');
        input.style.cssText = 'position:fixed;opacity:0;pointer-events:none;width:0;height:0';
        const label = document.createElement('label');
        document.body.append(input, label);
        label.htmlFor = input.id = '_ioh';
        return label;
      })();

      const haptic = (p) => { navigator.vibrate?.(p) ?? _iosHapticLabel.click(); };

      const useSwipeToDismiss = (onClose) => {
        const sheetRef = useRef(null);
        const drag = useRef({ active:false, startY:0, startTime:0, delta:0 });

        const onTouchStart = (e) => {
          const inner = sheetRef.current?.querySelector('[data-scroll]');
          if (inner && inner.scrollTop > 0) return;
          drag.current = { active:true, startY:e.touches[0].clientY, startTime:Date.now(), delta:0 };
          if (sheetRef.current) sheetRef.current.style.transition = 'none';
        };

        const onTouchMove = (e) => {
          if (!drag.current.active) return;
          const inner = sheetRef.current?.querySelector('[data-scroll]');
          if (inner && inner.scrollTop > 0) { drag.current.active = false; return; }
          const dy = Math.max(0, e.touches[0].clientY - drag.current.startY);
          drag.current.delta = dy;
          if (sheetRef.current) sheetRef.current.style.transform = `translateY(${dy}px)`;
        };

        const onTouchEnd = () => {
          if (!drag.current.active) return;
          drag.current.active = false;
          const { delta, startTime } = drag.current;
          const velocity = delta / (Date.now() - startTime);
          const shouldDismiss = delta > 120 || (delta > 80 && velocity > 0.8);
          if (shouldDismiss) {
            haptic([10, 50, 10]);
            if (sheetRef.current) {
              sheetRef.current.style.transition = 'transform 0.25s ease';
              sheetRef.current.style.transform = 'translateY(100%)';
            }
            setTimeout(onClose, 220);
          } else {
            if (sheetRef.current) {
              sheetRef.current.style.transition = 'transform 0.35s cubic-bezier(0.34,1.56,0.64,1)';
              sheetRef.current.style.transform = 'translateY(0)';
            }
          }
        };

        return { sheetRef, handlers: { onTouchStart, onTouchMove, onTouchEnd } };
      };

      const PALETTES = {
        rose: { bg:'oklch(0.97 0.012 60)',  surf:'#ffffff', ink:'oklch(0.18 0.012 50)', sub:'oklch(0.50 0.012 60)', line:'oklch(0.88 0.012 60)', accent:'oklch(0.66 0.13 18)',  accentInk:'#fff',     chip:'oklch(0.94 0.014 60)' },
        ash:  { bg:'oklch(0.97 0.006 250)', surf:'#ffffff', ink:'oklch(0.18 0.012 250)',sub:'oklch(0.48 0.012 250)',line:'oklch(0.88 0.008 250)',accent:'oklch(0.55 0.04 250)',  accentInk:'#fff',     chip:'oklch(0.94 0.008 250)' },
        sun:  { bg:'oklch(0.97 0.018 80)',  surf:'#ffffff', ink:'oklch(0.20 0.012 60)', sub:'oklch(0.48 0.012 60)', line:'oklch(0.88 0.012 70)', accent:'oklch(0.72 0.16 55)',   accentInk:'#241a0a', chip:'oklch(0.94 0.018 70)' },
        ink:  { bg:'oklch(0.18 0.008 50)',  surf:'oklch(0.22 0.008 50)', ink:'oklch(0.95 0.008 60)', sub:'oklch(0.65 0.012 60)', line:'oklch(0.30 0.008 50)', accent:'oklch(0.72 0.13 18)', accentInk:'#1a1410', chip:'oklch(0.26 0.008 50)' },
      };

      const Icon = ({ name, size=18, stroke=1.5, color='currentColor' }) => {
        const p = { width:size, height:size, viewBox:'0 0 24 24', fill:'none', stroke:color, strokeWidth:stroke, strokeLinecap:'round', strokeLinejoin:'round' };
        switch(name) {
          case 'plus':    return <svg {...p}><path d="M12 5v14M5 12h14"/></svg>;
          case 'arrow':   return <svg {...p}><path d="M5 12h14M13 6l6 6-6 6"/></svg>;
          case 'back':    return <svg {...p}><path d="M19 12H5M11 6l-6 6 6 6"/></svg>;
          case 'power':   return <svg {...p}><path d="M12 4v8"/><path d="M17.7 7.3a8 8 0 1 1-11.4 0"/></svg>;
          case 'gear':    return <svg {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>;
          case 'image':   return <svg {...p}><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>;
          case 'link':    return <svg {...p}><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></svg>;
          case 'rotate':  return <svg {...p}><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>;
          case 'crop':    return <svg {...p}><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M2 6h14a2 2 0 0 1 2 2v14"/></svg>;
          case 'x':       return <svg {...p}><path d="M6 6l12 12M18 6 6 18"/></svg>;
          case 'eraser':  return <svg {...p}><path d="m4 18 7-7 7 7"/><path d="M4 18h16"/><path d="M14 4 8 10l4 4 6-6z"/></svg>;
          case 'upload':  return <svg {...p}><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></svg>;
          case 'moon':    return <svg {...p}><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>;
          case 'sun-icon':return <svg {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>;
          case 'queue':   return <svg {...p}><path d="M3 6h12M3 12h12M3 18h8"/><path d="m17 14 4 4-4 4"/></svg>;
          case 'trash':   return <svg {...p}><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>;
          case 'next':    return <svg {...p}><path d="M5 12h14M13 6l6 6-6 6"/><path d="M19 5v14"/></svg>;
          default: return null;
        }
      };

      const HalftoneBg = ({ color='currentColor', opacity=0.08, size=4 }) => {
        const idRef = useRef(null);
        if (!idRef.current) idRef.current = 'ht' + Math.random().toString(36).slice(2,9);
        const id = idRef.current;
        return (
          <svg width="100%" height="100%" style={{ position:'absolute', inset:0, opacity, pointerEvents:'none' }}>
            <defs>
              <pattern id={id} x="0" y="0" width={size} height={size} patternUnits="userSpaceOnUse">
                <circle cx={size/2} cy={size/2} r={0.7} fill={color} />
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill={`url(#${id})`} />
          </svg>
        );
      };

      const DevicePreview = ({ pal, image, orientation='landscape', wifi='--', uptime='--', online=null, tailscaleAvail=false }) => {
        const isP = orientation === 'portrait';
        const w = isP ? 168 : 240;
        const h = isP ? 240 : 156;
        return (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:14 }}>
            <div style={{
              width:w+28, padding:14, borderRadius:18,
              background:`linear-gradient(180deg,${pal.surf},${pal.chip})`,
              border:`1px solid ${pal.line}`,
              boxShadow:`0 1px 0 ${pal.surf} inset,0 12px 28px -16px rgba(0,0,0,0.12)`,
              position:'relative',
            }}>
              <div style={{
                width:w, height:h, borderRadius:6,
                background:pal.chip, border:`1px solid ${pal.line}`,
                overflow:'hidden', position:'relative',
                filter:'saturate(0.55) contrast(1.04)',
              }}>
                {image
                  ? <img src={image} alt="" style={{ width:'100%', height:'100%', objectFit:'cover', display:'block' }} />
                  : <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', color:pal.sub, fontFamily:'Geist Mono,monospace', fontSize:10, letterSpacing:0.5 }}>NO IMAGE</div>
                }
                <HalftoneBg color={pal.ink} opacity={0.12} size={3} />
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', paddingTop:8 }}>
                <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                  <span style={{ width:5, height:5, borderRadius:99, background:pal.accent, boxShadow:`0 0 6px ${pal.accent}` }} />
                  <span style={{ fontFamily:'Geist Mono,monospace', fontSize:9, letterSpacing:1.5, color:pal.sub, textTransform:'uppercase' }}>plnk·01</span>
                </div>
                <span style={{ fontFamily:'Geist Mono,monospace', fontSize:9, color:pal.sub }}>{wifi}</span>
              </div>
            </div>
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:5 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8, color:pal.sub }}>
                <span style={{ width:6, height:6, borderRadius:99, background: online === false ? '#ef4444' : '#22c55e' }} />
                <span style={{ fontFamily:'Geist Mono,monospace', letterSpacing:0.5, textTransform:'uppercase', fontSize:10 }}>
                  {online === false
                    ? window.location.protocol === 'https:'
                      ? <span>offline · <a href="http://pi.local" style={{ color:pal.accent, textDecoration:'none' }}>pi.local ↗</a></span>
                      : 'offline · reconnecting'
                    : `online · ${uptime}`}
                </span>
              </div>
              {tailscaleAvail && (
                <a href="https://pi.tail4e929d.ts.net" style={{ fontFamily:'Geist Mono,monospace', fontSize:9, letterSpacing:0.5, textTransform:'uppercase', color:pal.accent, textDecoration:'none' }}>switch to tailscale ↗</a>
              )}
            </div>
          </div>
        );
      };

      const Tile = ({ pal, children, onClick, style={}, accent=false }) => (
        <button onClick={onClick} style={{
          appearance:'none', textAlign:'left', cursor:'pointer', width:'100%',
          background:accent ? pal.accent : pal.surf, color:accent ? pal.accentInk : pal.ink,
          border:`1px solid ${accent ? pal.accent : pal.line}`,
          borderRadius:16, padding:'16px 18px', fontSize:15,
          transition:'transform .15s ease', ...style,
        }}
        onMouseDown={e=>e.currentTarget.style.transform='scale(0.985)'}
        onMouseUp={e=>e.currentTarget.style.transform=''}
        onMouseLeave={e=>e.currentTarget.style.transform=''}
        onTouchStart={e=>{haptic(10);e.currentTarget.style.transform='scale(0.985)';}}
        onTouchEnd={e=>e.currentTarget.style.transform=''}
        onTouchCancel={e=>e.currentTarget.style.transform=''}>
          {children}
        </button>
      );

      const SectionHeader = ({ pal, children, right }) => (
        <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', padding:'0 4px', marginBottom:10 }}>
          <span style={{ fontFamily:'Geist Mono,monospace', fontSize:10, letterSpacing:1.5, color:pal.sub, textTransform:'uppercase' }}>{children}</span>
          {right && <span style={{ fontFamily:'Geist Mono,monospace', fontSize:10, color:pal.sub }}>{right}</span>}
        </div>
      );

      // ── HOME ─────────────────────────────────────────────────────────────────────
      const Home = ({ pal, onOpen, onPower, state, queueCount, online, tailscaleAvail }) => {
        const today = new Date().toLocaleDateString('en',{ weekday:'long', month:'short', day:'numeric' });
        return (
          <div style={{ padding:'8px 22px 48px', display:'flex', flexDirection:'column', gap:26 }}>
            {/* top bar */}
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', paddingTop:6 }}>
              <div style={{ display:'flex', alignItems:'baseline', gap:8 }}>
                <span style={{ fontFamily:'Instrument Serif,serif', fontSize:30, lineHeight:1, color:pal.ink, letterSpacing:-0.5 }}>Plink</span>
                <span style={{ fontFamily:'Instrument Serif,serif', fontStyle:'italic', fontSize:18, color:pal.accent }}>&middot;01</span>
              </div>
              <button onClick={onPower} style={{ width:38, height:38, borderRadius:99, background:pal.surf, border:`1px solid ${pal.line}`, display:'grid', placeItems:'center', cursor:'pointer', color:pal.ink, appearance:'none' }}>
                <Icon name="power" size={16} />
              </button>
            </div>

            {/* hero */}
            <div>
              <p style={{ fontFamily:'Geist Mono,monospace', fontSize:10, letterSpacing:1.5, color:pal.sub, textTransform:'uppercase', margin:0 }}>{today}</p>
              <h1 style={{ fontFamily:'Instrument Serif,serif', fontWeight:400, fontSize:36, lineHeight:1.05, color:pal.ink, margin:'8px 0 0', letterSpacing:-0.6 }}>
                Send a moment to your <em style={{ color:pal.accent }}>plink</em>.
              </h1>
            </div>

            {/* device card */}
            <div style={{ position:'relative', borderRadius:20, padding:'28px 18px 22px', background:pal.surf, border:`1px solid ${pal.line}`, overflow:'hidden' }}>
              <HalftoneBg color={pal.ink} opacity={0.05} size={5} />
              <DevicePreview pal={pal} image={state.image} orientation={state.orientation} wifi={state.wifi} uptime={state.uptime} online={online} tailscaleAvail={tailscaleAvail} />
            </div>

            {/* actions */}
            <div>
              <SectionHeader pal={pal}>Send</SectionHeader>
              <div style={{ display:'grid', gridTemplateColumns:'1.2fr 1fr', gap:10 }}>
                <Tile pal={pal} accent onClick={() => onOpen('upload')} style={{ padding:'20px 18px' }}>
                  <div style={{ display:'flex', flexDirection:'column', gap:22, minHeight:96, justifyContent:'space-between' }}>
                    <Icon name="upload" size={22} />
                    <div>
                      <div style={{ fontFamily:'Instrument Serif,serif', fontSize:24, lineHeight:1, letterSpacing:-0.3 }}>New photo</div>
                      <div style={{ fontSize:12, opacity:0.85, marginTop:4 }}>From device</div>
                    </div>
                  </div>
                </Tile>
                <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                  <Tile pal={pal} onClick={() => onOpen('queue')} style={{ padding:'14px 16px', flex:1 }}>
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                      <Icon name="queue" size={18} />
                      <span style={{ fontFamily:'Geist Mono,monospace', fontSize:11, color:pal.sub }}>{queueCount > 0 ? String(queueCount).padStart(2,'0') : '--'}</span>
                    </div>
                    <div style={{ marginTop:10, fontFamily:'Instrument Serif,serif', fontSize:18 }}>Queue</div>
                  </Tile>
                  <Tile pal={pal} onClick={() => onOpen('settings')} style={{ padding:'14px 16px', flex:1 }}>
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                      <Icon name="gear" size={18} />
                      <span style={{ fontFamily:'Geist Mono,monospace', fontSize:11, color:pal.sub }}>{state.orientation === 'portrait' ? 'P' : 'L'}</span>
                    </div>
                    <div style={{ marginTop:10, fontFamily:'Instrument Serif,serif', fontSize:18 }}>Tune</div>
                  </Tile>
                </div>
              </div>
            </div>

            {/* device status */}
            <div>
              <SectionHeader pal={pal}>Device</SectionHeader>
              <div style={{ background:pal.surf, border:`1px solid ${pal.line}`, borderRadius:16, padding:'16px 18px' }}>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:10 }}>
                  {[
                    ['Mode', state.orientation === 'portrait' ? 'Portrait' : 'Landscape'],
                    ['Wi-Fi', state.wifi || '--'],
                    ['Uptime', state.uptime || '--'],
                  ].map(([k,v]) => (
                    <div key={k}>
                      <div style={{ fontFamily:'Geist Mono,monospace', fontSize:9, color:pal.sub, letterSpacing:0.5, textTransform:'uppercase' }}>{k}</div>
                      <div style={{ fontFamily:'Instrument Serif,serif', fontSize:18, color:pal.ink, lineHeight:1.1, marginTop:4 }}>{v}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      };

      // ── Sheet shell ───────────────────────────────────────────────────────────────
      const Sheet = ({ pal, title, subtitle, onClose, zIndex=35, children }) => {
        const [open, setOpen] = useState(false);
        const { sheetRef, handlers } = useSwipeToDismiss(onClose);
        useEffect(() => { haptic(15); requestAnimationFrame(() => setOpen(true)); }, []);
        return (
          <div style={{ position:'fixed', inset:0, zIndex, display:'flex', flexDirection:'column', justifyContent:'flex-end' }}>
            <div onPointerDown={(e) => { window.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); }, { capture:true, once:true }); onClose(); }} style={{ position:'absolute', inset:0, background:'rgba(0,0,0,0.4)', backdropFilter:'blur(2px)' }}/>
            <div ref={sheetRef} {...handlers} onPointerDown={e=>e.stopPropagation()} onClick={e=>e.stopPropagation()} style={{ position:'relative', background:pal.bg, borderTopLeftRadius:28, borderTopRightRadius:28, padding:'14px 22px 144px', marginBottom:'-100px', boxShadow:`0 -1px 0 ${pal.line}`, transform: open ? 'translateY(0)' : 'translateY(32px)', transition:'transform 0.3s cubic-bezier(0.34,1.56,0.64,1)' }}>
              <div style={{ width:36, height:4, background:pal.line, borderRadius:99, margin:'0 auto 18px' }}/>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:18, gap:12 }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontFamily:'Geist Mono,monospace', fontSize:10, letterSpacing:1.5, color:pal.sub, textTransform:'uppercase' }}>{subtitle}</div>
                  <h2 style={{ fontFamily:'Instrument Serif,serif', fontWeight:400, fontSize:28, color:pal.ink, margin:'4px 0 0', letterSpacing:-0.4 }}>{title}</h2>
                </div>
                <button onClick={onClose} style={{ appearance:'none', background:pal.chip, border:`1px solid ${pal.line}`, borderRadius:99, width:32, height:32, display:'grid', placeItems:'center', cursor:'pointer', color:pal.ink, flexShrink:0 }}>
                  <Icon name="x" size={14}/>
                </button>
              </div>
              <div data-scroll="" style={{ overflowY:'auto', maxHeight:'70vh', display:'flex', flexDirection:'column', gap:18 }}>{children}</div>
            </div>
          </div>
        );
      };

      // ── UPLOAD sheet ──────────────────────────────────────────────────────────────
      const UploadSheet = ({ pal, onClose, onPickFile }) => {
        const [drag, setDrag] = useState(false);
        const fileRef = useRef(null);

        return (
          <Sheet pal={pal} title="New photo" subtitle="Choose a photo" onClose={onClose}>
            <div
              onDragOver={e=>{ e.preventDefault(); setDrag(true); }}
              onDragLeave={()=>setDrag(false)}
              onDrop={e=>{ e.preventDefault(); setDrag(false); const f=e.dataTransfer?.files?.[0]; if(f&&f.type.startsWith('image/')) onPickFile(f); }}
              onClick={()=>fileRef.current?.click()}
              style={{
                border:`1.5px dashed ${drag ? pal.accent : pal.line}`,
                background:pal.chip, borderRadius:16, padding:'36px 18px',
                textAlign:'center', cursor:'pointer', position:'relative', overflow:'hidden',
              }}>
              <HalftoneBg color={pal.ink} opacity={0.05} size={4} />
              <input ref={fileRef} type="file" accept="image/*" style={{ display:'none' }}
                onChange={e=>{ if(e.target.files?.[0]) onPickFile(e.target.files[0]); }} />
              <div style={{ width:56, height:56, margin:'0 auto', borderRadius:14, background:pal.surf, border:`1px solid ${pal.line}`, display:'grid', placeItems:'center', color:pal.ink }}>
                <Icon name="image" size={22}/>
              </div>
              <div style={{ fontSize:13, color:pal.sub, marginTop:16 }}>tap to browse &middot; JPG, PNG, HEIC</div>
            </div>
          </Sheet>
        );
      };

      // ── CROP screen (Cropper.js) ──────────────────────────────────────────────────
      const CropScreen = ({ pal, imageFile, imageDataUrl, orientation, onCancel, onConfirm }) => {
        const imgRef = useRef(null);
        const cropperRef = useRef(null);
        const isP = orientation === 'portrait';
        const DW = isP ? 480 : 800;
        const DH = isP ? 800 : 480;

        useEffect(() => {
          if (!imgRef.current || typeof Cropper === 'undefined') return;
          cropperRef.current = new Cropper(imgRef.current, {
            aspectRatio: DW / DH,
            viewMode: 1,
            guides: true,
            center: true,
            autoCropArea: 1,
            cropBoxResizable: false,
            dragMode: 'move',
            background: false,
          });
          return () => { cropperRef.current?.destroy(); };
        }, []);

        const sendAsIs = () => onConfirm({ type:'asis', file:imageFile });
        const cropSend = () => {
          if (!cropperRef.current) { sendAsIs(); return; }
          cropperRef.current.getCroppedCanvas({ width:DW, height:DH })
            .toBlob(blob => onConfirm({ type:'crop', blob }), 'image/jpeg', 0.92);
        };

        return (
          <div style={{ position:'absolute', inset:0, background:'#111', display:'flex', flexDirection:'column', zIndex:30 }}>
            {/* header */}
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'14px 22px', background:pal.bg, flexShrink:0 }}>
              <button onClick={onCancel} style={{ appearance:'none', background:'transparent', border:'none', color:pal.ink, cursor:'pointer', display:'flex', alignItems:'center', gap:6, fontSize:14 }}>
                <Icon name="back" size={18}/> Cancel
              </button>
              <div style={{ fontFamily:'Instrument Serif,serif', fontSize:22, color:pal.ink }}>Frame it</div>
              <span style={{ width:70 }}/>
            </div>
            {/* cropper area */}
            <div style={{ flex:1, overflow:'hidden', position:'relative' }}>
              <img ref={imgRef} src={imageDataUrl} alt="" style={{ maxWidth:'100%', display:'block' }} />
            </div>
            {/* controls */}
            <div style={{ padding:'14px 22px 32px', background:pal.bg, flexShrink:0 }}>
              <p style={{ fontFamily:'Geist Mono,monospace', fontSize:10, color:pal.sub, letterSpacing:0.5, textAlign:'center', margin:'0 0 14px', textTransform:'uppercase' }}>
                Drag to reposition &middot; Pinch/scroll to zoom &middot; {DW}&times;{DH}
              </p>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
                <button onClick={sendAsIs} style={{ appearance:'none', cursor:'pointer', background:pal.surf, color:pal.ink, border:`1px solid ${pal.line}`, borderRadius:14, padding:'14px', fontSize:14 }}>Send as is</button>
                <button onClick={cropSend} style={{ appearance:'none', cursor:'pointer', background:pal.accent, color:pal.accentInk, border:'none', borderRadius:14, padding:'14px', fontSize:14, fontWeight:500, display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
                  <Icon name="crop" size={15}/> Crop &amp; send
                </button>
              </div>
            </div>
          </div>
        );
      };

      // ── Toggle ────────────────────────────────────────────────────────────────────
      const Toggle = ({ pal, on, onChange }) => (
        <button onClick={()=>{haptic(10);onChange(!on);}} style={{
          appearance:'none', cursor:'pointer', border:`1px solid ${pal.line}`,
          width:44, height:26, borderRadius:99, padding:2,
          background:on ? pal.accent : pal.chip, transition:'background .18s',
          display:'flex', alignItems:'center', justifyContent:on?'flex-end':'flex-start',
        }}>
          <span style={{ width:20, height:20, borderRadius:99, background:pal.surf, boxShadow:'0 1px 2px rgba(0,0,0,0.18)' }}/>
        </button>
      );

      // ── SETTINGS sheet ────────────────────────────────────────────────────────────
      const SettingsSheet = ({ pal, state, setState, onClose, onRotate, onClearGhost, palette, setPalette, onPower }) => (
        <Sheet pal={pal} title="Tune" subtitle="Display & device" onClose={onClose}>
          {/* orientation */}
          <div>
            <SectionHeader pal={pal}>Orientation</SectionHeader>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
              {['landscape','portrait'].map(o => {
                const sel = state.orientation === o;
                return (
                  <button key={o} onClick={()=>setState(s=>({...s, orientation:o}))} style={{
                    appearance:'none', cursor:'pointer', textAlign:'left',
                    background:sel ? pal.surf : pal.chip,
                    border:`1.5px solid ${sel ? pal.ink : pal.line}`, borderRadius:14, padding:'16px 14px',
                  }}>
                    <div style={{ height:56, display:'grid', placeItems:'center' }}>
                      <div style={{ width:o==='portrait'?32:48, height:o==='portrait'?48:32, border:`1.5px solid ${pal.ink}`, borderRadius:4, position:'relative' }}>
                        <span style={{ position:'absolute', inset:4, background:sel?pal.accent:pal.line, borderRadius:2, opacity:sel?1:0.4 }}/>
                      </div>
                    </div>
                    <div style={{ fontFamily:'Instrument Serif,serif', fontSize:18, color:pal.ink, marginTop:6, textTransform:'capitalize' }}>{o}</div>
                    <div style={{ fontFamily:'Geist Mono,monospace', fontSize:10, color:pal.sub, letterSpacing:0.5 }}>{o==='portrait'?'480 × 800':'800 × 480'}</div>
                  </button>
                );
              })}
            </div>
          </div>

          {/* theme */}
          <div>
            <SectionHeader pal={pal}>Theme</SectionHeader>
            <div style={{ display:'flex', gap:8 }}>
              {Object.keys(PALETTES).map(p=>(
                <button key={p} onClick={()=>setPalette(p)} title={p} style={{
                  appearance:'none', cursor:'pointer', flex:1, height:32, borderRadius:99,
                  background:PALETTES[p].accent,
                  border:`2.5px solid ${palette===p ? pal.ink : 'transparent'}`,
                  transition:'border-color .18s',
                }}/>
              ))}
            </div>
          </div>

          {/* maintenance */}
          <div>
            <SectionHeader pal={pal}>Maintenance</SectionHeader>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
              <Tile pal={pal} onClick={onClearGhost} style={{ padding:'14px 14px' }}>
                <Icon name="eraser" size={18}/>
                <div style={{ fontFamily:'Instrument Serif,serif', fontSize:18, marginTop:8 }}>Clear ghosting</div>
                <div style={{ fontFamily:'Geist Mono,monospace', fontSize:10, color:pal.sub, letterSpacing:0.5 }}>3 cycle refresh</div>
              </Tile>
              <Tile pal={pal} onClick={onRotate} style={{ padding:'14px 14px' }}>
                <Icon name="rotate" size={18}/>
                <div style={{ fontFamily:'Instrument Serif,serif', fontSize:18, marginTop:8 }}>Rotate 90°</div>
                <div style={{ fontFamily:'Geist Mono,monospace', fontSize:10, color:pal.sub, letterSpacing:0.5 }}>Redisplays image</div>
              </Tile>
            </div>
          </div>

          {/* device telemetry */}
          <div style={{ background:pal.chip, border:`1px solid ${pal.line}`, borderRadius:14, padding:'14px 16px' }}>
            <div style={{ fontFamily:'Geist Mono,monospace', fontSize:10, letterSpacing:1.5, color:pal.sub, textTransform:'uppercase' }}>Device</div>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:10, marginTop:10 }}>
              {[['Wi-Fi',state.wifi||'--'],['Uptime',state.uptime||'--']].map(([k,v])=>(
                <div key={k}>
                  <div style={{ fontFamily:'Geist Mono,monospace', fontSize:9, color:pal.sub, letterSpacing:0.5, textTransform:'uppercase' }}>{k}</div>
                  <div style={{ fontFamily:'Instrument Serif,serif', fontSize:20, color:pal.ink, lineHeight:1.1 }}>{v}</div>
                </div>
              ))}
            </div>
          </div>

        </Sheet>
      );

      // ── QUEUE sheet ───────────────────────────────────────────────────────────────
      const INTERVAL_OPTIONS = [
        { label:'Off',  minutes:0 },
        { label:'30m',  minutes:30 },
        { label:'1h',   minutes:60 },
        { label:'2h',   minutes:120 },
        { label:'6h',   minutes:360 },
        { label:'12h',  minutes:720 },
        { label:'24h',  minutes:1440 },
      ];

      const QueueSheet = ({ pal, queue, onClose, onRemove, onNext, onShow, onSetInterval, onAddPhoto }) => {
        const items  = queue.items  || [];
        const cur    = queue.current || 0;
        const itvMin = queue.interval || 0;

        return (
          <Sheet pal={pal} title="Queue" subtitle={`${items.length} photo${items.length !== 1 ? 's' : ''} · ${itvMin ? 'rotates every ' + INTERVAL_OPTIONS.find(o=>o.minutes===itvMin)?.label : 'manual'}`} onClose={onClose}>

            {/* auto-rotate interval */}
            <div>
              <div style={{ fontFamily:'Geist Mono,monospace', fontSize:10, letterSpacing:1.5, color:pal.sub, textTransform:'uppercase', marginBottom:8 }}>Auto-rotate</div>
              <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
                {INTERVAL_OPTIONS.map(opt => {
                  const sel = itvMin === opt.minutes;
                  return (
                    <button key={opt.minutes} onClick={() => onSetInterval(opt.minutes)} style={{
                      appearance:'none', cursor:'pointer', fontSize:12,
                      background: sel ? pal.ink : pal.chip,
                      color: sel ? pal.bg : pal.sub,
                      border: `1px solid ${sel ? pal.ink : pal.line}`,
                      borderRadius:99, padding:'5px 12px',
                      fontFamily:'Geist Mono,monospace', letterSpacing:0.3,
                    }}>{opt.label}</button>
                  );
                })}
              </div>
            </div>

            {/* queue list */}
            {items.length === 0 ? (
              <div style={{ textAlign:'center', padding:'28px 0', color:pal.sub, fontFamily:'Geist Mono,monospace', fontSize:12 }}>Queue is empty</div>
            ) : (
              <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
                {items.map((it, i) => {
                  const isCur = i === cur;
                  return (
                    <div key={it.added_at} onClick={() => { if (!isCur) { haptic(10); onShow(i); } }} style={{
                      display:'flex', alignItems:'center', gap:14, padding:'10px 12px',
                      background: isCur ? pal.surf : pal.chip,
                      border:`1px solid ${isCur ? pal.accent : pal.line}`, borderRadius:14,
                      cursor: isCur ? 'default' : 'pointer',
                    }}>
                      {/* thumbnail */}
                      <div style={{ width:56, height:42, borderRadius:6, background:pal.line, border:`1px solid ${pal.line}`, overflow:'hidden', flexShrink:0, position:'relative' }}>
                        <img src={'/uploads/' + it.filename + '?t=' + Date.now()} alt="" style={{ width:'100%', height:'100%', objectFit:'cover', display:'block', filter:'saturate(0.5)' }} onError={e=>{ e.target.style.display='none'; }}/>
                        <HalftoneBg color="#000" opacity={0.12} size={3}/>
                      </div>
                      {/* label */}
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontFamily:'Instrument Serif,serif', fontSize:18, color:pal.ink, lineHeight:1.1, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{it.label}</div>
                        <div style={{ fontFamily:'Geist Mono,monospace', fontSize:10, color: isCur ? pal.accent : pal.sub, letterSpacing:0.5, textTransform:'uppercase', marginTop:2 }}>
                          {isCur ? 'Now showing' : `#${i + 1}`}
                        </div>
                      </div>
                      {/* remove */}
                      <button onClick={e => { e.stopPropagation(); onRemove(i); }} style={{ appearance:'none', background:'transparent', border:'none', cursor:'pointer', color:pal.sub, padding:4, flexShrink:0 }}>
                        <Icon name="trash" size={15}/>
                      </button>
                    </div>
                  );
                })}
              </div>
            )}

            {/* actions row */}
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
              <button onClick={onAddPhoto} style={{
                appearance:'none', cursor:'pointer', background:'transparent',
                color:pal.ink, border:`1px dashed ${pal.line}`, borderRadius:14,
                padding:'14px', fontSize:14, display:'flex', alignItems:'center', justifyContent:'center', gap:8,
              }}>
                <Icon name="plus" size={15}/> Add photo
              </button>
              <button onClick={onNext} disabled={items.length < 2} style={{
                appearance:'none', cursor:'pointer',
                background: items.length < 2 ? pal.chip : pal.surf,
                color: items.length < 2 ? pal.sub : pal.ink,
                border:`1px solid ${pal.line}`, borderRadius:14,
                padding:'14px', fontSize:14, display:'flex', alignItems:'center', justifyContent:'center', gap:8,
                opacity: items.length < 2 ? 0.5 : 1,
              }}>
                <Icon name="next" size={15}/> Next photo
              </button>
            </div>
          </Sheet>
        );
      };



      // ── Loading overlay ───────────────────────────────────────────────────────────
      const Loading = ({ pal, message, sub }) => (
        <div style={{ position:'fixed', inset:0, zIndex:50, background:`${pal.bg}ee`, backdropFilter:'blur(4px)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:20 }}>
          <div style={{ width:52, height:52, border:`2px solid ${pal.line}`, borderTopColor:pal.accent, borderRadius:99, animation:'spin 0.8s linear infinite' }}/>
          <div style={{ fontFamily:'Instrument Serif,serif', fontSize:22, color:pal.ink }}>{message}</div>
          {sub && <div style={{ fontFamily:'Geist Mono,monospace', fontSize:11, color:pal.sub, letterSpacing:0.5 }}>{sub}</div>}
        </div>
      );

      // ── APP root ──────────────────────────────────────────────────────────────────
      function PlinkApp() {
        const [palette, setPalette] = useState('rose');
        const pal = PALETTES[palette];

        const [screen, setScreen] = useState('home'); // home | crop
        const [sheet, setSheet]   = useState(null);   // null | upload | settings | queue | power
        const [loading, setLoading] = useState(false);
        const [loadMsg, setLoadMsg] = useState('');
        const [loadSub, setLoadSub] = useState('');
        const [cropData, setCropData] = useState(null); // { file, dataUrl }

        const [state, setState] = useState({ image: null, orientation: 'landscape', wifi: '--', uptime: '--' });
        const [queue, setQueue]   = useState({ items: [], current: 0, interval: 0 });
        const [toast, setToast]   = useState('');
        const [online, setOnline] = useState(null); // null=unknown, true=connected, false=offline
        const [tailscaleAvail, setTailscaleAvail] = useState(false);
        const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3000); };

        // Lock body scroll when a sheet/modal is open
        useEffect(() => {
          document.body.style.overflow = sheet ? 'hidden' : '';
          return () => { document.body.style.overflow = ''; };
        }, [sheet]);

        const refreshAll = () => {
          fetch('/api/status', { signal: AbortSignal.timeout(5000) })
            .then(r => { if (!r.ok) throw 0; return r.json(); })
            .then(d => {
              setOnline(true);
              setState(s => ({
                ...s,
                image: d.image_url ? d.image_url + '?t=' + Date.now() : s.image,
                orientation: d.orientation || 'landscape',
                wifi: d.wifi || '--',
                uptime: d.uptime || '--',
              }));
              fetch('/api/queue').then(r=>r.json()).then(setQueue).catch(()=>{});
            })
            .catch(() => setOnline(false));
        };

        // Poll every 8s when offline (fast reconnect), 30s when online
        useEffect(() => {
          const t = setTimeout(refreshAll, online === false ? 8000 : 30000);
          return () => clearTimeout(t);
        }, [online]);

        useEffect(() => {
          refreshAll();
          if (new URLSearchParams(window.location.search).get('shared') === '1') {
            window.history.replaceState({}, '', '/');
            showToast('Photo added to queue');
          }
          if (window.location.hostname === 'pi.local') {
            fetch('https://pi.tail4e929d.ts.net/api/status', { signal: AbortSignal.timeout(4000) })
              .then(r => { if (r.ok) setTailscaleAvail(true); })
              .catch(() => {});
          }
        }, []);

        const doUpload = async (fd) => {
          const showNow = fd.get('show_now') === '1';
          setLoading(true);
          setLoadMsg(showNow ? 'Sending to display…' : 'Adding to queue…');
          setLoadSub(showNow ? 'E-ink refresh · ~30 s' : '');
          try {
            const r = await fetch('/api/queue/add', { method:'POST', body:fd });
            const d = await r.json();
            if (d.ok) {
              setQueue(d.queue);
              if (showNow && d.image_url) {
                setState(s => ({ ...s, image: d.image_url + '?t=' + Date.now() }));
              }
            } else { alert('Upload failed: ' + (d.error || 'unknown')); }
          } catch(e) { alert('Upload error: ' + e.message); }
          finally { setLoading(false); }
        };

        const doAction = async (action) => {
          setSheet(null);
          const isReboot   = action === 'reboot';
          const isShutdown = action === 'shutdown';
          if (isReboot)   { setLoading(true); setLoadMsg('Restarting…');     setLoadSub('Reconnecting when Pi is back…'); }
          if (isShutdown) { setLoading(true); setLoadMsg('Shutting down…');  setLoadSub('Power off the Pi safely'); }
          const fd = new FormData(); fd.append('action', action);
          try { await fetch('/api/action', { method:'POST', body:fd }); } catch(e) {}
          if (isReboot) {
            // Poll until the Pi responds, then reload
            const poll = () => {
              fetch('/api/status', { signal: AbortSignal.timeout(3000) })
                .then(() => window.location.reload())
                .catch(() => setTimeout(poll, 2000));
            };
            setTimeout(poll, 20000); // give Pi time to shut down before polling
          }
          if (!isReboot && !isShutdown) setLoading(false);
        };

        const handlePickFile = (file, showNow = true) => {
          const reader = new FileReader();
          reader.onload = e => { setCropData({ file, dataUrl: e.target.result, showNow }); setSheet(null); setScreen('crop'); };
          reader.readAsDataURL(file);
        };

        const handleCropConfirm = async (result) => {
          const showNow = cropData?.showNow !== false;
          setScreen('home'); setCropData(null);
          const fd = new FormData();
          const origName = cropData?.file?.name || 'photo.jpg';
          const baseName = origName.replace(/\.[^.]+$/, '');
          if (result.type === 'crop' && result.blob) {
            fd.append('file', result.blob, 'photo_' + Date.now() + '.jpg');
            fd.append('label', baseName);
          } else if (result.file) {
            fd.append('file', result.file);
            fd.append('label', baseName);
          }
          if (showNow) fd.append('show_now', '1');
          await doUpload(fd);
        };

        const setStateAndSave = (updater) => {
          setState(prev => {
            const next = typeof updater === 'function' ? updater(prev) : updater;
            if (next.orientation !== prev.orientation) {
              fetch('/api/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ orientation: next.orientation }) }).catch(()=>{});
            }
            return next;
          });
        };

        const handleRotate = async () => {
          setSheet(null); setLoading(true); setLoadMsg('Rotating…'); setLoadSub('E-ink refresh · ~30 s');
          const fd = new FormData(); fd.append('action','rotate');
          try {
            const r = await fetch('/api/action', { method:'POST', body:fd });
            const d = await r.json();
            if (d.ok && d.image_url) setState(s => ({ ...s, image: d.image_url + '?t=' + Date.now() }));
          } catch(e) {}
          setLoading(false);
        };

        const handleClearGhost = async () => {
          setSheet(null); setLoading(true); setLoadMsg('Clearing ghosting…'); setLoadSub('E-ink refresh · ~60 s');
          const fd = new FormData(); fd.append('action','clear_ghost');
          try { await fetch('/api/action', { method:'POST', body:fd }); } catch(e) {}
          setLoading(false);
        };

        const handleQueueRemove = async (idx) => {
          haptic([10, 50, 10]);
          const wasCurrentItem = idx === queue.current;
          const hadMoreItems = queue.items.length > 1;
          const showEinkLoader = wasCurrentItem && hadMoreItems;

          // Show loader immediately — backend is async so response comes back fast
          if (showEinkLoader) {
            setLoading(true); setLoadMsg('Updating display…'); setLoadSub('E-ink refresh · ~30 s');
            setTimeout(() => setLoading(false), 32000);
          }

          try {
            const r = await fetch('/api/queue/remove', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ index: idx }) });
            const d = await r.json();
            if (d.ok) {
              setQueue(d.queue);
              if (showEinkLoader) {
                const newItem = d.queue.items[d.queue.current];
                if (newItem) setState(s => ({ ...s, image: '/uploads/' + newItem.filename + '?t=' + Date.now() }));
              }
            }
          } catch(e) {}
        };

        const handleQueueNext = async () => {
          setSheet(null);
          setLoading(true); setLoadMsg('Next photo…'); setLoadSub('E-ink refresh · ~30 s');
          try {
            const r = await fetch('/api/queue/next', { method:'POST' });
            const d = await r.json();
            if (d.ok) { setQueue(d.queue); refreshAll(); }
          } catch(e) {}
          setLoading(false);
        };

        const handleQueueShow = async (idx) => {
          if (idx === queue.current) return;
          setLoading(true); setLoadMsg('Switching photo…'); setLoadSub('E-ink refresh · ~30 s');
          try {
            const r = await fetch('/api/queue/show', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ index: idx }) });
            const d = await r.json();
            if (d.ok) {
              setQueue(d.queue);
              const item = d.queue.items[idx];
              if (item) setState(s => ({ ...s, image: '/uploads/' + item.filename + '?t=' + Date.now() }));
            }
          } catch(e) {}
          setLoading(false);
        };

        const handleQueueInterval = async (minutes) => {
          try {
            await fetch('/api/queue/interval', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ minutes }) });
            setQueue(q => ({ ...q, interval: minutes }));
          } catch(e) {}
        };

        return (
          <div style={{ width:'100%', background:pal.bg, color:pal.ink, position:'relative' }}>
            <HalftoneBg color={pal.ink} opacity={0.025} size={6} />
            <div style={{ position:'relative', overflowY: sheet ? 'hidden' : 'auto', minHeight:'100vh' }}>
              {screen === 'home' && <Home pal={pal} onOpen={k=>setSheet(k)} onPower={()=>setSheet('power')} state={state} queueCount={queue.items.length} online={online} tailscaleAvail={tailscaleAvail}/>}
            </div>

            {screen === 'crop' && cropData && (
              <CropScreen pal={pal} imageFile={cropData.file} imageDataUrl={cropData.dataUrl}
                orientation={state.orientation}
                onCancel={()=>{ setScreen('home'); setCropData(null); }}
                onConfirm={handleCropConfirm}/>
            )}

            {sheet === 'upload'     && <UploadSheet pal={pal} onClose={()=>setSheet(null)} onPickFile={handlePickFile}/>}
            {sheet === 'queue-add'  && <UploadSheet pal={pal} onClose={()=>setSheet(null)} onPickFile={f=>handlePickFile(f, false)}/>}
            {sheet === 'settings' && <SettingsSheet pal={pal} state={state} setState={setStateAndSave} onClose={()=>setSheet(null)} onRotate={handleRotate} onClearGhost={handleClearGhost} palette={palette} setPalette={setPalette} onPower={()=>setSheet('power')}/>}
            {sheet === 'queue'    && <QueueSheet pal={pal} queue={queue} onClose={()=>setSheet(null)} onRemove={handleQueueRemove} onNext={handleQueueNext} onShow={handleQueueShow} onSetInterval={handleQueueInterval} onAddPhoto={()=>setSheet('queue-add')}/>}
            {sheet === 'power'    && (
              <Sheet pal={pal} title="Goodnight, pilnk?" subtitle="Power" onClose={()=>setSheet(null)} zIndex={40}>
                <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
                  {[
                    { id:'reboot',   icon:'rotate', title:'Restart',   sub:'Quick reboot', tone:'soft' },
                    { id:'shutdown', icon:'power',  title:'Power off', sub:'Shutdown the Pi safely',       tone:'danger' },
                  ].map(opt=>(
                    <button key={opt.id} onClick={()=>{ haptic(opt.tone==='danger' ? [10,50,10] : 10); doAction(opt.id); }} style={{
                      appearance:'none', cursor:'pointer', textAlign:'left',
                      background:opt.tone==='danger' ? 'rgba(220,50,50,0.06)' : pal.surf,
                      border:`1px solid ${opt.tone==='danger' ? pal.accent : pal.line}`,
                      borderRadius:16, padding:'14px 16px', display:'flex', alignItems:'center', gap:14,
                    }}>
                      <div style={{ width:40, height:40, borderRadius:10, background:opt.tone==='danger'?pal.accent:pal.chip, color:opt.tone==='danger'?pal.accentInk:pal.ink, display:'grid', placeItems:'center', flexShrink:0 }}>
                        <Icon name={opt.icon} size={18}/>
                      </div>
                      <div style={{ flex:1 }}>
                        <div style={{ fontFamily:'Instrument Serif,serif', fontSize:20, color:opt.tone==='danger'?pal.accent:pal.ink, lineHeight:1.1 }}>{opt.title}</div>
                        <div style={{ fontSize:12, color:pal.sub, marginTop:2 }}>{opt.sub}</div>
                      </div>
                      <Icon name="arrow" size={16} color={pal.sub}/>
                    </button>
                  ))}
                </div>
              </Sheet>
            )}

            {loading && <Loading pal={pal} message={loadMsg} sub={loadSub}/>}

            {toast && (
              <div style={{
                position:'fixed', bottom:32, left:'50%', transform:'translateX(-50%)',
                background:pal.ink, color:pal.bg, borderRadius:20, padding:'10px 20px',
                fontSize:13, fontFamily:'Geist,sans-serif', zIndex:200,
                whiteSpace:'nowrap', pointerEvents:'none',
                boxShadow:'0 4px 20px rgba(0,0,0,0.25)',
              }}>{toast}</div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<PlinkApp/>);
      {% endraw %}
    </script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      }
    </script>
  </body>
</html>
