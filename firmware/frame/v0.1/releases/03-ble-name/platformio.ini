[platformio]
src_dir = src
include_dir = include

[env:esp32-s3-devkitc-1]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
board_build.arduino.memory_type = qio_opi
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D BOARD_HAS_PSRAM
; GxEPD2 and Adafruit GFX removed — using GooDisplay's native driver (src/Display_EPD_W21.*)

