[platformio]
src_dir = src
include_dir = include

[env:esp32-s3-devkitc-1]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
board_build.arduino.memory_type = qio_opi
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D BOARD_HAS_PSRAM
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^2.5.0
; GxEPD2 and Adafruit GFX removed — using GooDisplay's native driver (src/Display_EPD_W21.*)
; ArduinoJson — frame-canonical queue.json (multi-slot gallery model, v0.1)
; NimBLE-Arduino — replaced the classic ESP32 BLE Arduino (Bluedroid) library 2026-07-15;
; Bluedroid's BLEAdvertising can't keep advertising through an active connection, which an
; earlier attempt at plink-ios#52 needed (later reverted, but the migration itself stays —
; also fixed advertising failing to start at all under the old library in some configs).

; plinkOS#35: flash over the DevKitC-1's native "USB" port (USB-Serial-JTAG, no external
; UART bridge) instead of the "UART" port — much faster on this platform, especially as the
; binary grows. Kept as a SEPARATE env, not a replacement: [env:esp32-s3-devkitc-1] above is
; the known-good fallback until this is validated on hardware. `ARDUINO_USB_CDC_ON_BOOT=1`
; transparently remaps `Serial` onto USB-CDC in the Arduino-ESP32 core — main.cpp only calls
; plain Serial.begin()/Serial.print*, no firmware code changes needed.
[env:esp32-s3-devkitc-1-usb]
extends = env:esp32-s3-devkitc-1
board_build.usb_mode = hardware_cdc
build_flags =
  ${env:esp32-s3-devkitc-1.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
