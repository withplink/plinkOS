[platformio]
src_dir = src
include_dir = include

[env:esp32-s3-devkitc-1]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -D CORE_DEBUG_LEVEL=3
lib_deps =
  https://github.com/smarthomeagentur/GxEPD2.git#v1.6.6
  adafruit/Adafruit GFX Library@^1.11.11

